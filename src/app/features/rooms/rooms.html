<ng-container *transloco="let t">
  <header class="page-header">
    <h1>{{ t('rooms.title') }}</h1>
  </header>

  <!-- the calls the page is made of, each with its freshness and its failure, told once -->
  <app-sources-strip [sources]="sources" domain="devices" loadingLabel="rooms.loading" />

  @if (devices() === undefined && !registry.loading()) {
    <p class="rooms__note">{{ t('rooms.registryUnreadable') }}</p>
  }

  <!-- a floor is a row of rooms in the order of the house; a row that does not fill the page
       stands in its middle -->
  @for (floor of floors(); track floor.id) {
    <section class="floor" data-testid="floor" [attr.data-floor]="floor.id">
      <h2 class="floor__name">{{ t(floor.label) }}</h2>
      <div class="floor__rooms">
        @for (room of floor.rooms; track room.room) {
          <app-room-tile [overview]="room" (details)="openRoom(room.room, floor.label)" />
        }
      </div>
    </section>
  }
</ng-container>
