<ng-container *transloco="let t">
  <a class="shell__skip-link" href="#main-content" (click)="skipToContent($event, main)">{{
    t('app.skipToContent')
  }}</a>

  <!-- One panel, laid out by CSS: a column on the left of a wide screen (brand, navigation,
       language), a bar across the top of a phone (brand, language - the navigation is then the
       bottom bar). Both navigations are in the DOM and CSS shows one, so the layout never jumps
       while JavaScript measures the screen. -->
  <!-- the photo of the open view, under the glow -->
  <app-view-background />

  <aside class="shell__panel">
    <a class="shell__brand" routerLink="/">
      <mat-icon class="shell__brand-icon">home</mat-icon>
      <span>{{ appName }}</span>
    </a>

    <nav class="shell__side-nav" [attr.aria-label]="t('nav.label')">
      <mat-nav-list>
        @for (item of navItems; track item.path) {
          <a
            mat-list-item
            [routerLink]="item.path"
            routerLinkActive="shell__side-link--active"
            #link="routerLinkActive"
            [activated]="link.isActive"
            [attr.aria-current]="link.isActive ? 'page' : null"
          >
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ t(item.label) }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>

    <!-- Slot of the weather strip: outdoor temperature, humidity and the rest of the weather
         station readings land here once a service provides them. -->
    <div class="shell__weather" data-slot="weather"></div>

    <div class="shell__panel-foot">
      <app-language-menu />
    </div>
  </aside>

  <main class="shell__content" id="main-content" tabindex="-1" #main>
    <router-outlet />
  </main>

  <nav class="shell__bottom-nav" [attr.aria-label]="t('nav.label')">
    @for (item of navItems; track item.path) {
      <a
        class="shell__bottom-link"
        [routerLink]="item.path"
        routerLinkActive="shell__bottom-link--active"
        #link="routerLinkActive"
        [attr.aria-current]="link.isActive ? 'page' : null"
      >
        <span class="shell__bottom-icon"
          ><mat-icon>{{ item.icon }}</mat-icon></span
        >
        <span class="shell__bottom-label">{{ t(item.label) }}</span>
      </a>
    }
  </nav>
</ng-container>
