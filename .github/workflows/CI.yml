name: CI

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check the translation keys used in templates
        run: npm run check:i18n

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the production bundle
        run: npm run check:bundle

      - name: Check the contrast of the theme (WCAG AA)
        run: npm run check:contrast

      - name: Install the browser for the end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (mock API)
        run: npm run e2e

      # the container is the artifact that gets deployed, so its nginx configuration is tested
      # here, in a real browser, and not for the first time on the cluster
      - name: Build the image
        run: docker build --build-arg APP_VERSION=0.0.0-ci --build-arg GIT_COMMIT=${{ github.sha }} -t web-application:ci .

      - name: Smoke test of the image
        run: |
          docker run -d --name web-application --read-only --tmpfs /tmp -p 8080:8080 web-application:ci
          for attempt in $(seq 1 20); do
            curl -fs http://localhost:8080/healthz > /dev/null && break
            sleep 1
          done
          IMAGE_URL=http://localhost:8080 EXPECTED_VERSION=0.0.0-ci npm run e2e

      - name: Logs of the image
        if: ${{ always() }}
        run: docker logs web-application || true

      # The screenshots are the evidence a pull request points to, so they are an artifact of
      # their own and a run that has none to upload fails: they were once deleted before the
      # upload, which only warned, and nobody noticed for three pull requests.
      - name: Upload the screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 14

      - name: Upload the test reports and traces
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: |
            test-results/
            test-results-image/
            playwright-report/
            playwright-report-image/
          retention-days: 14

      # The embed of sarisia/actions-status-discord without its "Event" field (the commit and
      # its whole message): that action can only show all of the context or none of it, so the
      # message is built here. Nothing of the workflow context is interpolated into the script -
      # it arrives through the environment. The empty field in the middle is not inline: it keeps
      # the four others in two rows of two, as in the embed of that action.
      - name: Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
          TRIGGERED_BY: ${{ github.triggering_actor }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No Discord webhook in this run - nothing sent"
            exit 0
          fi
          case "$JOB_STATUS" in
            success)   label="Success";   color=2664261 ;;
            cancelled) label="Cancelled"; color=14396169 ;;
            *)         label="Failure";   color=13313073 ;;
          esac
          repository_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          jq -n \
            --arg title "$label: $GITHUB_WORKFLOW ${GITHUB_REPOSITORY#*/}" \
            --argjson color "$color" \
            --arg repository "[$GITHUB_REPOSITORY]($repository_url)" \
            --arg ref "$GITHUB_REF" \
            --arg actor "$TRIGGERED_BY" \
            --arg workflow "[$GITHUB_WORKFLOW]($repository_url/actions/runs/$GITHUB_RUN_ID)" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds: [{title: $title, color: $color, timestamp: $timestamp, fields: [
               {name: "Repository", value: $repository, inline: true},
               {name: "Ref", value: $ref, inline: true},
               {name: "\u200b", value: "\u200b", inline: false},
               {name: "Triggered by", value: $actor, inline: true},
               {name: "Workflow", value: $workflow, inline: true}
             ]}]}' > discord.json
          curl --silent --show-error --fail --max-time 20 \
            -H "Content-Type: application/json" --data @discord.json "$DISCORD_WEBHOOK" \
            || echo "::warning::The Discord notification was not delivered"
