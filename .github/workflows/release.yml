name: release

on:
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "GIT_TAG=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo 'latest')" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: magikabdul/web-application
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.GIT_TAG }}

      # the application is built inside the image (multi-stage Dockerfile); the tag and the
      # commit are stamped into it and shown on the About page
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.GIT_TAG }}
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
