# nginx of the web-application image: serves the built Angular application and nothing else.
# Backend calls never arrive here - in the cluster the ingress sends /home to
# api-gateway-service and only the rest to this container.

# One JSON object per request, so Loki parses the lines with `| json` like the service logs.
log_format json escape=json
  '{"@timestamp":"$time_iso8601","level":"INFO","logger":"nginx.access",'
  '"method":"$request_method","path":"$uri","status":$status,'
  '"bytes":$body_bytes_sent,"duration":$request_time,'
  '"forwardedFor":"$http_x_forwarded_for","userAgent":"$http_user_agent"}';

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  access_log /var/log/nginx/access.log json;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Probes of the Deployment; kept out of the log, they arrive every few seconds.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # /home belongs to the API gateway. A request for it that reaches this container means the
  # ingress is not routing it - answer in the error contract of the backend instead of handing
  # the application its own index.html as if it were API data.
  location ^~ /home {
    default_type application/json;
    return 404 '{"errors":[{"message":"The API gateway is not routed on this host"}]}';
  }

  # Files with a content hash in the name (main-PAT5WD6S.js, media/roboto-...-LOX3CHMS.woff2)
  # never change under the same name: the browser may keep them for good.
  location ~ "-[A-Za-z0-9_-]{8}\.(js|css|woff2?)$" {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Everything else: a real file when there is one, otherwise index.html, so a deep link such as
  # /about opened or reloaded in the browser reaches the Angular router (SPA fallback).
  # index.html itself must be revalidated on every load - it is what names the hashed files, so
  # a cached copy would keep an old version running after a deploy.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
