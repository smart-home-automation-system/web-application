# Included in every location that serves the application: an add_header inside a location
# replaces the ones inherited from the server block, so they cannot simply be declared once there.

# Everything comes from this origin: scripts, styles, fonts, images and API calls (the ingress
# serves the API under /home on the same host). 'unsafe-inline' for styles is what Angular needs
# for the <style> elements of its components; scripts get no such exception.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
