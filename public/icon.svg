<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The icon of the application: a house of the season's gold and rust on the deep navy page of
       the Zorza look, lit by an aurora of the two summer colours; one lit window. -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232857"/>
      <stop offset="1" stop-color="#0d0f1d"/>
    </linearGradient>
    <radialGradient id="aurora" cx="0.2" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#4dd0e1" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#c2a3ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0d0f1d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="house" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff7a3d"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#page)"/>
  <rect width="64" height="64" rx="15" fill="url(#aurora)"/>
  <path d="M32 13 L53 31 H47 V51 H17 V31 H11 Z" fill="url(#house)"/>
  <rect x="28" y="38" width="8" height="13" rx="1.5" fill="#0d0f1d" opacity="0.9"/>
  <rect x="38.5" y="35" width="6" height="6" rx="1" fill="#fff6d8"/>
</svg>
