sonar.organization=smart-home-automation-system
sonar.projectKey=smart-home-automation-system_web-application
sonar.host.url=https://sonarcloud.io

sonar.sources=src,scripts,nginx,Dockerfile
sonar.tests=src,e2e
sonar.test.inclusions=src/**/*.spec.ts,e2e/**/*.ts
sonar.exclusions=src/**/*.spec.ts

# en.ts and pl.ts have the same shape by design: every key of one exists in the other
sonar.cpd.exclusions=src/app/i18n/**

# the mock API never ships, and main.ts only bootstraps
sonar.coverage.exclusions=src/mocks/**,src/main.ts,scripts/**,e2e/**,playwright.config.ts
sonar.javascript.lcov.reportPaths=coverage/web-application/lcov.info
